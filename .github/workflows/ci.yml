name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image with compose
        env:
          OFFERLOG_PASSWORD_HASH: ci-placeholder
        run: docker compose build
      - name: Smoke-test the container
        run: |
          docker run -d --name offerlog -p 4220:4220 -e OFFERLOG_PASSWORD_HASH=ci-placeholder offerlog
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4220/api/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs offerlog
          test "$code" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4220/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:4220/api/export?format=json')" = "401"
