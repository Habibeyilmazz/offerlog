services:
  offerlog:
    build: .
    image: offerlog
    ports:
      - "4220:4220"
    environment:
      # Generate with: node scripts/hash-password.ts >> .env
      OFFERLOG_PASSWORD_HASH: ${OFFERLOG_PASSWORD_HASH:?Set OFFERLOG_PASSWORD_HASH in .env (node scripts/hash-password.ts)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - offerlog-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4220/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

volumes:
  offerlog-data:
